; Seeed Studio XIAO nRF52840 Sense — non-mbed (Adafruit nRF52) core.
; Bluefruit is built into this core. The onboard LSM6DS3TR-C is driven
; directly over Wire so no extra IMU library is required.
;
; If this board id is missing from your platform checkout, switch `board`
; to seeed-xiao-afruitnrf52-nrf52840 (same chip, same pins).

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_archive = no
